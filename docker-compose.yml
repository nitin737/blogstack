  #     - SPRING_PROFILES_ACTIVE=docker
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   networks:
  #     - blogstack-network

  # ============================================
  # CORE SERVICES
  # ============================================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: blogging-auth-service
    ports:
      - "8081:8080"
    env_file:
      - auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    # config-service:
    #   condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - blogstack-network

